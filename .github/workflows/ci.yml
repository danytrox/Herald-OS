name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch the pinned Hermes Agent snapshot
        run: npm run sync-upstream
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bridge:
    name: Bridge plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - name: pytest
        run: HERALD_OS_PYTHON="$(command -v python)" bash scripts/test-bridge.sh

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every bash and Python script
        run: |
          failed=0
          while IFS= read -r file; do
            case "$(head -n 1 "$file")" in
              '#!'*bash*) bash -n "$file" || failed=1 ;;
              '#!'*python*) python3 -m py_compile "$file" || failed=1 ;;
            esac
          done < <(git ls-files)
          exit "$failed"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/check-secrets.sh
